name: Keep Render demo warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 150 --retry 2 --retry-delay 5 --retry-all-errors \
            https://joblens-demo.onrender.com/actuator/health
