services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${JOBLENS_DB_NAME:-joblens}
      POSTGRES_USER: ${JOBLENS_DB_USERNAME:-joblens}
      POSTGRES_PASSWORD: ${JOBLENS_DB_PASSWORD:?Set JOBLENS_DB_PASSWORD in the environment or an ignored .env file}
    ports:
      - "${JOBLENS_DB_PORT:-5432}:5432"
    volumes:
      - joblens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  joblens-postgres-data:
