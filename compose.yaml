services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${JOBLENS_DB_NAME:-joblens}
      POSTGRES_USER: ${JOBLENS_DB_USERNAME:-joblens}
      POSTGRES_PASSWORD: ${JOBLENS_DB_PASSWORD:?Set JOBLENS_DB_PASSWORD in the environment or an ignored .env file}
    ports:
      - "${JOBLENS_DB_PORT:-5432}:5432"
    volumes:
      - joblens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  app:
    build: .
    image: joblens:local
    environment:
      JOBLENS_DB_URL: jdbc:postgresql://postgres:5432/${JOBLENS_DB_NAME:-joblens}
      JOBLENS_DB_USERNAME: ${JOBLENS_DB_USERNAME:-joblens}
      JOBLENS_DB_PASSWORD: ${JOBLENS_DB_PASSWORD:?Set JOBLENS_DB_PASSWORD in the environment or an ignored .env file}
    ports:
      - "${JOBLENS_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  joblens-postgres-data:
