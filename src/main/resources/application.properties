spring.application.name=joblens

# Web server
server.port=${JOBLENS_SERVER_PORT:8080}
server.error.include-stacktrace=never

# PostgreSQL is the shared store for JobLens data and Spring Batch metadata.
spring.datasource.url=${JOBLENS_DB_URL:jdbc:postgresql://localhost:5432/joblens}
spring.datasource.username=${JOBLENS_DB_USERNAME:joblens}
spring.datasource.password=${JOBLENS_DB_PASSWORD:joblens-local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the application schema. Migrations run when the application starts.
spring.flyway.enabled=true

# Batch jobs must be launched explicitly. Flyway owns Batch metadata creation.
spring.batch.job.enabled=false

# OpenAPI inspection (Swagger UI is available at /swagger-ui.html).
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Expose operational health without publishing every actuator endpoint.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Adzuna discovery. Credentials are required only when the discovery job runs.
joblens.adzuna.app-id=${ADZUNA_APP_ID:}
joblens.adzuna.app-key=${ADZUNA_APP_KEY:}
joblens.adzuna.base-url=${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
joblens.adzuna.timeout=${ADZUNA_TIMEOUT:10s}
joblens.adzuna.max-pages=${ADZUNA_MAX_PAGES:5}
joblens.adzuna.page-size=${ADZUNA_PAGE_SIZE:20}
joblens.adzuna.max-days-old=${ADZUNA_MAX_DAYS_OLD:30}
joblens.adzuna.retry-attempts=${ADZUNA_RETRY_ATTEMPTS:3}
joblens.adzuna.retry-backoff=${ADZUNA_RETRY_BACKOFF:250ms}

# Greenhouse public Job Board API. Boards are detected and validated internally from official URLs.
joblens.greenhouse.base-url=${GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io}
joblens.greenhouse.timeout=${GREENHOUSE_TIMEOUT:10s}
joblens.greenhouse.retry-attempts=${GREENHOUSE_RETRY_ATTEMPTS:3}
joblens.greenhouse.retry-backoff=${GREENHOUSE_RETRY_BACKOFF:250ms}

# Lever public Postings API. Sites are detected internally from official hosted job URLs.
joblens.lever.base-url=${LEVER_BASE_URL:https://api.lever.co}
joblens.lever.timeout=${LEVER_TIMEOUT:10s}
joblens.lever.page-size=${LEVER_PAGE_SIZE:50}
joblens.lever.retry-attempts=${LEVER_RETRY_ATTEMPTS:3}
joblens.lever.retry-backoff=${LEVER_RETRY_BACKOFF:250ms}

# Jooble public job-search API. Its regional key is optional; confirm preferences after adding it.
joblens.jooble.api-key=${JOOBLE_API_KEY:}
joblens.jooble.base-url=${JOOBLE_BASE_URL:https://sg.jooble.org}
joblens.jooble.country-code=${JOOBLE_COUNTRY_CODE:sg}
joblens.jooble.timeout=${JOOBLE_TIMEOUT:10s}
joblens.jooble.page-size=${JOOBLE_PAGE_SIZE:20}
joblens.jooble.retry-attempts=${JOOBLE_RETRY_ATTEMPTS:3}
joblens.jooble.retry-backoff=${JOOBLE_RETRY_BACKOFF:250ms}

# ESCO v1.2.1 open taxonomy import. The Batch job is launched explicitly through its REST endpoint.
joblens.esco.base-url=${ESCO_BASE_URL:https://ec.europa.eu/esco/api}
joblens.esco.version=${ESCO_VERSION:1.2.1}
joblens.esco.page-size=${ESCO_PAGE_SIZE:250}
joblens.esco.timeout=${ESCO_TIMEOUT:30s}
joblens.esco.retry-attempts=${ESCO_RETRY_ATTEMPTS:3}
joblens.esco.retry-backoff=${ESCO_RETRY_BACKOFF:500ms}
joblens.esco.insecure-tls=${ESCO_INSECURE_TLS:false}

# Raw-to-normalized intelligence processing.
joblens.intelligence.chunk-size=${JOBLENS_INTELLIGENCE_CHUNK_SIZE:20}
joblens.intelligence.fuzzy-minimum-score=${JOBLENS_FUZZY_MINIMUM_SCORE:75}
joblens.intelligence.fuzzy-likely-score=${JOBLENS_FUZZY_LIKELY_SCORE:90}

# A running Find Jobs execution is recoverable only after every Batch update is this old.
joblens.find-jobs.stale-after=${JOBLENS_FIND_JOBS_STALE_AFTER:30m}
