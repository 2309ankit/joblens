<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Candidate Profile</title></head><body><main><h1>Candidate Profile</h1><p th:text="${profile.summary}">Profile</p><h2>Upload resume</h2><form method="post" action="/profile/resume" enctype="multipart/form-data"><input type="file" name="file" accept=".pdf,.doc,.docx" required><button type="submit">Read resume</button></form><p th:if="${result}" th:text="'Found skills: ' + ${result.detectedSkills}"></p><h2>Skills</h2><ul><li th:each="skill : ${profile.skills}" th:text="${skill}">Java</li></ul><p>Review skills, then use Swagger to save corrections with PUT /api/candidate-profile.</p><a href="/dashboard">Back</a></main></body></html>
